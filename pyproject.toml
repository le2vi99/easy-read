[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "easy-read"
version = "0.1.0"
description = "Read technical books in digestible chunks with AI comprehension questions"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "PyMuPDF>=1.24",
    "httpx>=0.27",
]

[project.scripts]
easy-read = "easy_read.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/easy_read"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]
